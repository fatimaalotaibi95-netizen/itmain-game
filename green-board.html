<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بصمة أمي الخضراء</title><style>body{font-family:system-ui,Tahoma,sans-serif;background:#eef7eb;color:#184d2c;margin:0}main{max-width:760px;margin:auto;padding:22px}header,.panel{background:white;border-radius:22px;padding:24px;margin:16px 0;box-shadow:0 5px 20px #184d2c14}h1{text-align:center;margin:8px}p{text-align:center}.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.topic{background:#e6f5da;border:2px solid #acd5a7;color:#18552f;border-radius:20px;padding:20px 12px;cursor:pointer;font:inherit;font-size:17px;min-height:115px}.topic.selected{border-color:#167a38;background:#c9efbd}.topic span{display:block;font-size:32px}.field{display:block;margin:14px 0;font-weight:600}input,textarea{box-sizing:border-box;width:100%;padding:14px;border-radius:12px;border:1px solid #a6c7a7;font:inherit;margin-top:7px}textarea{min-height:100px}.action{border:0;border-radius:14px;background:#20733b;color:white;padding:14px 20px;font:inherit;font-weight:bold;cursor:pointer;width:100%}.action:disabled{opacity:.5;cursor:not-allowed}.notice{font-size:13px;color:#526b57}.note{border-radius:16px;padding:14px;background:#eff8e7;margin:8px 0;overflow-wrap:anywhere}.note small{color:#547359}.hidden{display:none}.status{padding:12px;text-align:center}</style></head><body><main><header><h1>🌳 بصمة أمي الخضراء</h1><p>من قلب البيت إلى قلب الحصة</p><p>اختاري ورقة الشجرة، ثم اكتبي بصمتك البيئية 💚</p></header><section class="panel"><h2>🌿 اختاري فرع بصمتك</h2><div class="topics" id="topics"></div><form id="form"><label class="field">اسم الأم (اختياري)<input id="mother" maxlength="40" placeholder="يمكنكِ المشاركة دون اسم"></label><label class="field">رسالتك البيئية<textarea id="message" maxlength="220" required placeholder="كيف نحافظ على بيئتنا؟"></textarea></label><button class="action" id="submit" type="submit">🌱 ازرعي بصمتك الخضراء</button></form><div id="status" class="status" aria-live="polite"></div></section><section class="panel"><h2>🌳 شجرة رسائل الأمهات</h2><div id="notes"></div><p class="notice">في هذه النسخة التجريبية تظهر رسالتك على جهازك فقط. لعرض رسائل الأمهات معًا، استخدمي النموذج المشترك الموضح في التعليمات.</p></section><p class="notice">معلمة المادة: فاطمة الثبيتي</p></main><script>const topics=[['🌍','بيئتنا أمانة','بيئتنا أمانة… فلنحافظ عليها'],['💧','قطرة ماء','قطرة ماء نوفرها اليوم تصنع فرقًا غدًا'],['🧹','النظافة تبدأ من بيتنا','النظافة تبدأ من بيوتنا'],['♻️','إعادة الاستخدام','أعيدي الاستخدام لتحمي بيئتك'],['🌱','ازرعي الأمل','ازرعي نبتة وازرعي معها الأمل']];let current=0;const notes=[];const topicEl=document.getElementById('topics');function renderTopics(){topicEl.innerHTML='';topics.forEach((t,i)=>{let b=document.createElement('button');b.className='topic'+(i===current?' selected':'');b.type='button';b.innerHTML='<span>'+t[0]+'</span>'+t[1];b.onclick=()=>{current=i;renderTopics();document.getElementById('message').placeholder=t[2]};topicEl.appendChild(b)})}function renderNotes(){const el=document.getElementById('notes');el.innerHTML='';if(!notes.length){el.textContent='كوني أول أم تترك بصمتها 🌿';return}notes.forEach(n=>{let d=document.createElement('div');d.className='note';let title=document.createElement('strong');title.textContent=topics[n.topic][0]+' '+topics[n.topic][1];let p=document.createElement('p');p.textContent=n.message;p.style.textAlign='right';let small=document.createElement('small');small.textContent='— '+(n.mother||'أم مشاركة');d.append(title,p,small);el.append(d)})}document.getElementById('form').onsubmit=e=>{e.preventDefault();const mother=document.getElementById('mother').value.trim();const message=document.getElementById('message').value.trim();if(!message)return;notes.unshift({topic:current,mother,message});renderNotes();document.getElementById('message').value='';document.getElementById('status').textContent='💚 أضيفت رسالتك إلى لوحة هذا الجهاز. شكرًا لمشاركتك!'};renderTopics();renderNotes();</script></body></html>
